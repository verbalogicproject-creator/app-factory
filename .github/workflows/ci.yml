name: ci

# appfactory checking ITSELF.
#
# This repository shipped a verification pipeline and had no verification of its own,
# and three failures followed directly from that:
#
#   1. "12 checks" survived in six places while 19 were on disk
#   2. runtime/manifest.sha256 drifted 86 files and 7 checks behind, unread by anything
#   3. the marketplace advertised an interview, a contract and UNVERIFIED.md for a
#      plugin that was a manifest and nothing else
#
# All three are one disease -- an assertion nobody checks -- and all three were found by
# a human reading files, which is the most expensive detector available.
#
# THE ECONOMICS ARE THE SAME ARGUMENT THIS REPO MAKES ABOUT ANDROID BUILDS. The whole
# job is seconds, needs no JDK, no Android SDK and no network, and it runs on every
# push. There is no cheaper rung to demote anything to.
#
# Deliberately NOT a matrix, and deliberately not scheduled: nothing here depends on a
# toolchain version or on the passage of time.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The default token is read-only here. This job publishes nothing, comments nowhere and
# touches no external service; it reads files and exits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: Repo self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # PyYAML is the only dependency, and it is preinstalled on ubuntu-latest. Asserted
      # rather than assumed: a missing import would make the YAML check silently skip,
      # and a check that reports success without verifying anything is worse than no
      # check -- it ends the investigation. That sentence is this corpus's founding
      # lesson and it applies to its own CI.
      - name: Assert the checker's own dependencies
        run: |
          python3 -m pip install --quiet "pytest>=9" "cryptography>=42" ruff
          python3 -c "import yaml, json, hashlib, pytest, cryptography; print('deps ok')"
          command -v sha256sum >/dev/null || { echo "::error::sha256sum absent"; exit 1; }
          command -v ruff >/dev/null || { echo "::error::ruff absent"; exit 1; }

      - name: Repo self-check
        run: bash scripts/repo-check.sh

      # repo-check.sh only runs the fast subset (not slow, not device) so the two-second
      # economic argument in the header above still holds. The full suite -- including
      # the JDK keytool round trips and the full scaffold+preflight walk -- gets its own
      # step so a failure there is legible in the job list without opening a log.
      - name: Python tests
        run: python3 -m pytest -q

      # The corpus verifies itself against its fixtures. repo-check.sh already runs this,
      # but it is repeated as its own step so a failure is legible in the job list
      # without opening a log -- this is the check that matters most, and burying it
      # inside a composite step would make the expensive signal cheap to miss.
      - name: Preflight corpus selftest
        run: bash plugins/appfactory-core/runtime/scripts/preflight/selftest.sh

      # The generated project must pass the corpus the generator ships. The targetSdk
      # incident was exactly this: the bootstrap skill told an agent to scaffold with a
      # value check 140 exists to reject, so the pipeline's own default failed the
      # pipeline's own gate. A first-run user would have learned that a red check is
      # normal, which is how a corpus dies.
      - name: Scaffold a project and run the corpus against it
        run: |
          TARGET="$(mktemp -d)/demo"
          python3 plugins/appfactory-core/runtime/bin/scaffold.py "$TARGET" \
            --application-id com.example.democheck \
            --app-name "Demo Check"
          echo "--- generated at $TARGET ---"
          bash "$TARGET/scripts/preflight.sh" "$TARGET"

      - name: Summary
        if: always()
        run: |
          {
            echo "### appfactory self-check"
            echo ""
            echo "- checks in corpus: **$(find plugins/appfactory-core/runtime/scripts/preflight/checks -name '[0-9][0-9][0-9]-*.sh' | wc -l)**"
            echo "- runtime files under digest: **$(wc -l < plugins/appfactory-core/runtime/manifest.sha256)**"
            echo "- plugins advertised: **$(python3 -c "import json;print(len(json.load(open('.claude-plugin/marketplace.json'))['plugins']))")**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # repo-check.sh and the preflight corpus only READ the scaffolded output --
  # they never hand it to a JDK or an SDK. That leaves the actual promise of
  # this repo, "the thing it generates compiles", unverified by its own CI.
  # This job closes that gap on both architectures the generated project's own
  # ci.yml targets: x86_64 gets the full signed-nothing release compile (R8,
  # bundleRelease, mapping verification, same as a generated app's own CI),
  # ARM gets debug-only for the reason recorded in ci-arm-toolchain.sh and in
  # the generated ci.yml's build-arm job comment.
  # ---------------------------------------------------------------------
  build-demo:
    needs: repo-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK (ARM only -- x86_64 runners ship one)
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'. `tools` was removed from the SDK
          # repository, so the default fails ("Failed to find package 'tools'") -- first CI
          # run, 2026-09-17. build-tools and platforms are left to Gradle to download.
          packages: platform-tools

      - name: Scaffold a demo project
        run: |
          DEMO="${{ runner.temp }}/demo"
          python3 plugins/appfactory-core/runtime/bin/scaffold.py "$DEMO" \
            --application-id com.example.democheck \
            --app-name "Demo Check"
          echo "DEMO=$DEMO" >> "$GITHUB_ENV"

      - name: Vendor an aarch64 aapt2 (ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: ${{ env.DEMO }}
        run: bash scripts/ci-arm-toolchain.sh

      - name: Build debug and run unit tests (ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: ${{ env.DEMO }}
        run: |
          START=$SECONDS
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace \
            -Pandroid.aapt2FromMavenOverride="$PWD/.appfactory/tmp/aapt2"
          echo "BUILD_SECONDS=$(( SECONDS - START ))" >> "$GITHUB_ENV"
          bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Build debug, release and run unit tests (x86_64)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ env.DEMO }}
        run: |
          START=$SECONDS
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace
          echo "BUILD_SECONDS=$(( SECONDS - START ))" >> "$GITHUB_ENV"
          bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

          ./gradlew assembleRelease bundleRelease --stacktrace
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          bash scripts/verify-apk.sh "$RELEASE_APK"
          python3 .appfactory/bin/verify_mapping.py \
            app/build/outputs/mapping/release/mapping.txt \
            app/src/main/AndroidManifest.xml \
            app/src/main \
            com.example.democheck

      - name: Count unit tests
        if: always()
        working-directory: ${{ env.DEMO }}
        run: |
          shopt -s nullglob globstar
          total=0
          for f in app/build/test-results/**/*.xml; do
            n=$(sed -n 's/.*<testsuite[^>]* tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            total=$(( total + ${n:-0} ))
          done
          echo "UNIT_TEST_COUNT=$total" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "### demo build (${{ matrix.os }})"
            echo ""
            echo "- build seconds: **${BUILD_SECONDS:-unknown}**"
            echo "- unit tests executed: **${UNIT_TEST_COUNT:-0}**"
          } >> "$GITHUB_STEP_SUMMARY"
