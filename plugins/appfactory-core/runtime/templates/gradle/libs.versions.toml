# Pinned, known-good matrix. AGP / Kotlin / KSP / Compose form a tight compatibility
# lattice. KSP used to publish as <kotlin>-<ksp> (e.g. "2.0.0-1.0.21") and had to track
# Kotlin exactly; since the 2.x series it publishes plain semver and is pinned
# independently -- a KSP version can no longer be derived from a Kotlin version, so
# look it up or take a pair known to work together (see runtime/versions/2026-08-api36.toml).
#
# Nothing here is a range or a `+`. An unpinned version turns a green build into a
# time bomb that detonates on someone else's machine, months later.
#
# Provenance: this lattice is adopted from android/nowinandroid (maintained by Google,
# uses this exact stack) and confirmed here by compiling localmind on AGP 9.0.0.
# See runtime/versions/2026-08-api36.toml.

[versions]
agp = "9.0.0"
kotlin = "2.3.0"
ksp = "2.3.4"

coreKtx = "1.15.0"
lifecycle = "2.10.0"
activityCompose = "1.9.3"
composeBom = "2025.09.01"

hilt = "2.59"
hiltNavCompose = "1.2.0"
room = "2.8.3"
serialization = "1.8.0"

# web-shell kind only (runtime/templates/kinds/web-shell/). Declared in this one
# catalog rather than a second, kind-specific one so there is a single lattice to
# keep pinned; an unused entry on the compose kind's classpath is harmless, a
# second catalog silently drifting from this one is not. See
# runtime/versions/2026-08-api36.toml.
webkit = "1.12.1"
ktor = "3.2.0"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.6.1"
androidxTestRunner = "1.7.0"

# Gradle Play Publisher. 4.1.1 (2026-08-11) is the first line confirmed against
# Gradle 9.7; 4.0.0 (2026-01-25) added AGP 9 support. See app.build.gradle.kts
# for how credentials gate whether the `play` block does anything.
gpp = "4.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Declared explicitly. Using androidx.lifecycle.compose.* with only lifecycle-runtime-ktx
# on the classpath produced 1 root error and 4 cascade errors in ColdForge.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Explicit. ColdForge got this transitively via ktor-serialization and would have
# broken the moment ktor was dropped.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# web-shell kind only.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
play-publisher = { id = "com.github.triplet.play", version.ref = "gpp" }
