# Known-good version lattice for compileSdk 36. Validated 2026-08-15.
#
# PROVENANCE: adopted wholesale from android/nowinandroid, which is maintained by
# Google, actively built, and uses this exact stack -- Compose, Hilt, KSP, Room. Then
# confirmed here by compiling a real app against it.
#
# THAT PROVENANCE IS THE POINT, and it was learned the expensive way.
#
# The first attempt at this file derived a lattice by querying Maven metadata artifact
# by artifact and taking the newest of each. Three CI round trips followed, each
# discovering one more incompatibility:
#
#   Hilt 2.60.1        "only compatible with AGP 9.0.0 or higher"
#   kotlinOptions      removed; migrate to the compilerOptions DSL
#   kotlin 2.3.21      paired with KSP 2.3.11, which embeds stdlib 2.3.20
#
# Every individual version was defensible. The combination had never been built. That
# is the same failure class as a fabricated font certificate, one layer up the stack:
# plausible, correctly shaped, wrong -- and it is exactly what the S6 rule already
# forbids. A version lattice HAS a canonical upstream: a project that compiles.
#
# Corollary worth keeping: the binding constraint is usually the OLDEST component you
# are forced to keep, not the newest you want. Choosing AGP 8.13 to "stay safe" created
# the Hilt problem; moving to AGP 9 dissolved it.
#
# WHY THIS FILE IS SEPARATE FROM 2026-08.toml
# From 31 August 2026, new apps and app updates must target Android 16 (API 36) to be
# submitted to Google Play. 2026-08.toml pins AGP 8.3.1 / compileSdk 34, whose ceiling
# is API 34, so every app generated on it is born unsubmittable. The old file is kept
# rather than edited: a project already shipping on it can stay there deliberately.
#   https://developer.android.com/google/play/requirements/target-sdk

agp = "9.0.0"
kotlin = "2.3.0"
ksp = "2.3.4"

# KSP CHANGED ITS VERSIONING SCHEME. It used to publish as <kotlin>-<ksp>
# ("2.0.0-1.0.21") and had to track Kotlin exactly; it now publishes plain semver. A KSP
# version can no longer be DERIVED from a Kotlin version -- look it up, or take a pair
# that is known to work together. Getting this wrong is silent until KSP runs.

gradle = "9.4.0"              # AGP 9.0 floor is 9.1.0
jdk = "17"                    # unchanged from the 8.3 matrix; AGP 9 still floors at 17

compileSdk = 36               # the point of this file
targetSdk = 36
minSdk = 28                   # adaptive icons need 26; 28 avoids PNG fallbacks entirely

# The Compose compiler is a Kotlin plugin from 2.0 onward, versioned WITH Kotlin, so
# there is no separate composeCompiler pin to drift.
#
# Note this BOM is NOT the newest published (2026.08.00 exists). It is the one
# nowinandroid builds against. Newest is not the same as right, and preferring newest
# per-artifact is what produced the untested combination above.
composeBom = "2025.09.01"

coreKtx = "1.15.0"
lifecycle = "2.10.0"
activityCompose = "1.9.3"
hilt = "2.59"
hiltNavigationCompose = "1.2.0"
room = "2.8.3"
serialization = "1.8.0"
ktor = "3.2.0"                # not in nowinandroid. WAS 2.3.11, and that was wrong in a way
                              # only a device could show: Ktor 2.3.11 is built against
                              # kotlinx-coroutines 1.7/1.8, this lattice resolves 1.9.0 (the
                              # Compose/lifecycle stack forces it), and 1.9 DELETED the
                              # internal LockFreeLinkedListHead.addLast that ktor-events calls.
                              # Gradle upgrades the transitive dependency silently, so the app
                              # COMPILES, PACKAGES, passes every static check -- and throws
                              # NoSuchMethodError in onCreate. Found by the instrumented rung on
                              # a physical device, which is the first rung that runs anything.
                              #
                              # The lesson is the one this file already teaches, one level
                              # deeper: "a lattice has a canonical upstream -- a project that
                              # compiles" is not enough. It must be a project that RUNS.

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.6.1"
testRunner = "1.7.0"

# ── AGP 9 BREAKING CHANGES A GENERATED APP MUST ALREADY HANDLE ──────────────
# All three verified against nowinandroid rather than assumed, and all three are
# already applied in templates/gradle/:
#
#   1. `org.jetbrains.kotlin.android` must NOT be applied. AGP 9 provides Kotlin
#      support itself. kotlin.plugin.compose / .serialization / ksp / hilt all remain.
#   2. `android { kotlinOptions { } }` is gone. Use a top-level
#      `kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17 } }` -- an ASSIGNMENT,
#      not .set().
#   3. Apps compile against a NON-FINAL R class, so `when (id) { R.id.x -> }` constant
#      switches break. Use if/else.
#
# ── WHAT WAS PROVEN BEFORE THIS FILE STOPPED BEING A CANDIDATE ──────────────
# A dependency update is a VERSIONED PIPELINE CHANGE, not routine maintenance:
#
#   compile + unit tests + R8    green on a real app
#   androidTest COMPILES         ci.yml now runs assembleDebugAndroidTest, because
#                                push-CI never touched androidTest before and Room's
#                                MigrationTestHelper constructor changed shape in 2.7
#   Room identityHash stable     v1/v2/v3 unchanged across Room 2.6.1 -> 2.8.3 and
#                                KSP 2.0 -> 2.3.4, so installed copies still open
#   negative-fixture proof       selftest.sh green: every check still DETECTS its bug
#   generated-app proof          a fresh app scaffolded on this matrix reaches a
#                                signed APK
# ────────────────────────────────────────────────────────────────────────────
